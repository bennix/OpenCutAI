name: Desktop release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag
        required: true
        default: v0.1.11
      platform:
        description: Platform to build
        type: choice
        options: [all, linux, windows]
        default: all
permissions:
  contents: write
concurrency:
  group: desktop-release-${{ inputs.tag }}
  cancel-in-progress: true
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'linux' && '["ubuntu-22.04"]' || inputs.platform == 'windows' && '["windows-latest"]' || '["windows-latest", "ubuntu-22.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      DATABASE_URL: postgres://localhost/opencut
      BETTER_AUTH_SECRET: desktop-build-placeholder-no-auth
      UPSTASH_REDIS_REST_URL: https://example.invalid
      UPSTASH_REDIS_REST_TOKEN: unused
      NEXT_PUBLIC_MARBLE_API_URL: https://example.invalid
      MARBLE_WORKSPACE_KEY: unused
      FREESOUND_CLIENT_ID: unused
      FREESOUND_API_KEY: unused
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Linux package tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Install dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            bun install --frozen-lockfile --linker hoisted
          else
            bun install --frozen-lockfile
          fi
      - run: bun run scripts/package-desktop.ts
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            dist-desktop/*.exe
            dist-desktop/*.deb
            dist-desktop/*.rpm
      - name: Upload release packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          shopt -s nullglob
          files=(dist-desktop/*.exe dist-desktop/*.deb dist-desktop/*.rpm)
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
